version: '3.8'

services:
  visiontera-ai:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    image: visiontera-ai:latest
    container_name: visiontera-ai
    ports:
      - "8000:8000"

    # ── Environment ──────────────────────────────────────────────────────────
    environment:
      # API backend URL (override via .env or docker run -e)
      - base_url_dev=${base_url_dev:-https://visiontera-backend-697124318129.europe-west4.run.app}
      # Bearer token for pushing detections to backend
      - access_VT=${access_VT:-}
      # RTSP stream support (set to "true" and provide URLs to enable)
      - RTSP_ENABLED=${RTSP_ENABLED:-false}
      - RTSP_URLS=${RTSP_URLS:-}
      - RTSP_NAMES=${RTSP_NAMES:-}
      # NVIDIA GPU pass-through
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video

    # ── Volumes ──────────────────────────────────────────────────────────────
    volumes:
      # Persist log file on the host
      - ../../app.log:/app/app.log
      # Persist auto-collected training datasets on the host
      - ../../datasets:/app/datasets
      # Persist YOLO training runs on the host
      - ../../runs:/app/runs

    # ── GPU (NVIDIA) ─────────────────────────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # ── Health & restart ─────────────────────────────────────────────────────
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - visiontera-network

networks:
  visiontera-network:
    driver: bridge