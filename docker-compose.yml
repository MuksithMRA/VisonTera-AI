version: '3.8'

services:
  yolo-stream:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./yolo11n.pt:/app/yolo11n.pt:ro
      - ./runs:/app/runs:ro
      - ./app.log:/app/app.log
    devices:
      - /dev/video0:/dev/video0
    text:
      - environment:
        - NVIDIA_VISIBLE_DEVICES=all
        - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - yolo-network


networks:
  yolo-network:
    driver: bridge